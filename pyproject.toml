[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.44,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "microscan-ai"
version = "0.1.0"
description = "Reproducible image-classification baseline for microplastic microscopy research"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.1.3",
  "Pillow==11.0.0",
  "PyYAML==6.0.2",
  "torch==2.5.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.2"]

[project.scripts]
microscan = "microscan_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

